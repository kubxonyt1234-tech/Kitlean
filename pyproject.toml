[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitlean"
version = "0.3.0b1"
description = "Kitlean 0.3 Beta — prosty język z GUI tkinter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pygame>=2.6,<3", "Pillow>=10,<14"]
license = {text = "MIT"}
authors = [{name = "Kitlean contributors"}]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
kitlean = "kitlean.cli:main"

[tool.setuptools.packages.find]
include = ["kitlean*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gui: testy wymagające rzeczywistego tkinter i pulpitu", "audio: rzeczywisty mikser SDL i dekodery audio"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
